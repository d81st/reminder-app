plugins {
    id 'com.android.application'
}

android {
    namespace 'com.h4isenb.reminder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.h4isenb.reminder'
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    // Фиксированный debug-ключ, чтобы новые сборки ставились поверх старых без удаления приложения
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
