plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.h4isenb.reminder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.h4isenb.reminder'
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName '3.5'
    }

    // Свой ключ подписи приходит из CI (секреты SIGNING_KEYSTORE и SIGNING_PASSWORD), в репозитории его нет.
    // Тестовая сборка подписывается открытым debug-ключом, чтобы ставилась поверх прошлой тестовой.
    def releaseKeystore = System.getenv('SIGNING_KEYSTORE_FILE')
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'reminder'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // сжатие кода и ресурсов: APK меньше, приложение быстрее запускается
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            // ресурсы (шрифты, значки) нужны скриншот-тестам на Robolectric
            includeAndroidResources = true
            all {
                // скриншоты пишутся в app/build/screenshots и выкладываются CI как артефакт
                systemProperty 'roborazzi.test.record', 'true'
            }
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    // QR-коды: рисование и распознавание (core) и сканер камерой
    implementation 'sh.calvin.reorderable:reorderable:2.4.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }

    testImplementation 'junit:junit:4.13.2'
    // настоящий org.json для тестов кодировщика (в android.jar только заглушки)
    testImplementation 'org.json:json:20240303'
    // скриншот-тесты экранов без телефона: Robolectric рисует Compose, Roborazzi сохраняет PNG
    testImplementation platform('androidx.compose:compose-bom:2024.09.03')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.32.2'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.32.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
