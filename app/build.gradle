plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.h4isenb.reminder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.h4isenb.reminder'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '2.1'
    }

    // Фиксированный debug-ключ, чтобы новые сборки ставились поверх старых без удаления приложения
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    // QR-коды: рисование и распознавание (core) и сканер камерой
    implementation 'com.google.zxing:core:3.5.3'
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }

    testImplementation 'junit:junit:4.13.2'
    // настоящий org.json для тестов кодировщика (в android.jar только заглушки)
    testImplementation 'org.json:json:20240303'
}
