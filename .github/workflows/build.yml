name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # снимки экранов из скриншот-тестов: можно посмотреть дизайн, не устанавливая приложение
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots
          if-no-files-found: ignore

      # Свой ключ подписи из секретов (см. «Создать ключ подписи»). Без него, например в PR из форка,
      # собирается тестовая версия с ключом app/debug.keystore.
      - name: Prepare signing key
        id: key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE }}
          PW: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "file=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"
          else
            echo "Ключа подписи нет в секретах: будет тестовая сборка"
          fi

      - name: Build APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk Reminder.apk
          else
            # проверяем, что подписанная сборка тоже собирается: одноразовым ключом, результат выбрасывается
            keytool -genkeypair -keystore "$RUNNER_TEMP/check.p12" -storetype PKCS12 -alias reminder \
              -keyalg RSA -keysize 2048 -validity 1 -storepass checkcheck -keypass checkcheck -dname "CN=check" -noprompt
            SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/check.p12" SIGNING_PASSWORD=checkcheck gradle assembleRelease --no-daemon --stacktrace
            rm -rf "$RUNNER_TEMP/check.p12" app/build/outputs/apk/release
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk Reminder.apk
          fi

      # отпечаток ключа, которым подписан APK: сверить со своим ключом
      - name: Signature
        continue-on-error: true
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs Reminder.apk | grep -E "DN:|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: Reminder-apk
          path: Reminder.apk

      # Релиз выкладывается только из основной ветки; с остальных веток APK лежит в артефактах сборки
      - name: Publish release with APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Напоминалка, сборка ${{ github.run_number }}${{ steps.key.outputs.file == '' && ' (тестовый ключ)' || '' }}
          files: Reminder.apk

      # Снимки экранов ещё и в логе (сжатые JPEG в base64 между метками): так их можно посмотреть,
      # даже когда артефакты недоступны. Шаг последний, чтобы снимки были в самом конце лога.
      - name: Screenshots in log
        if: always()
        continue-on-error: true
        run: |
          ls app/build/screenshots || exit 0
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for f in sorted(glob.glob("app/build/screenshots/*.png")):
              im = Image.open(f).convert("RGB")
              im = im.resize((390, round(im.height * 390 / im.width)))
              buf = io.BytesIO()
              im.save(buf, "JPEG", quality=72)
              b = base64.b64encode(buf.getvalue()).decode()
              print("=====SHOT " + os.path.basename(f)[:-4] + "=====")
              for i in range(0, len(b), 8000):
                  print(b[i:i + 8000])
              print("=====END=====")
          PY
